services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-quiz}
      MYSQL_USER: ${DB_USER:-quiz}
      MYSQL_PASSWORD: ${DB_PASSWORD:-quiz}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./backend/database/seeds/001_demo.sql:/docker-entrypoint-initdb.d/002_demo.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-quiz}
      DB_USER: ${DB_USER:-quiz}
      DB_PASSWORD: ${DB_PASSWORD:-quiz}
      MERCURE_INTERNAL_URL: http://mercure/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-changeme-mercure-secret}
      CORS_ALLOWED_ORIGIN: ${FRONTEND_URL:-http://localhost:8081}
    volumes:
      - ./backend/public/media:/var/www/html/public/media
    ports:
      - "${BACKEND_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy

  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET:-changeme-mercure-secret}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET:-changeme-mercure-secret}
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins *
    ports:
      - "${MERCURE_PORT:-3000}:80"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
        VITE_MERCURE_URL: ${PUBLIC_MERCURE_URL:-http://localhost:3000/.well-known/mercure}
        VITE_FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
